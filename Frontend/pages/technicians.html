<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Técnicos - Sistema de Manutenção</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/dashboard.css">
        <link rel="stylesheet" href="../css/forms.css">
    </head>
    <body class="bg-light">
        <div class="container-fluid">
            <div class="row">
                <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100">
                    <h4 class="mb-4">Manutenção</h4>
                    <nav class="nav flex-column">
                        <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
                        <a class="nav-link text-white" href="equipments.html">Equipamentos</a>
                        <a class="nav-link text-white" href="categories.html">Categorias</a>
                        <a class="nav-link text-white active" href="technicians.html" aria-current="page">Técnicos</a>
                    </nav>
                </aside>
                <main class="col-md-9 col-lg-10 p-4">
                    <form class="row g-3 mb-4">
                        <div class="col-md-8">
                            <input id="searchInput" type="text" class="form-control" placeholder="Pesquisar Técnico...">
                        </div>
                        <div class="col-md-4">
                            <button type="button" class="btn btn-primary w-100">
                                Buscar técnicos
                            </button>
                        </div>
                    </form>
                    <div class="row">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Técnico</th>
                                    <th>Especialidade</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="techniciansTable">
                                <tr>
                                    <td>João Silva</td>
                                    <td>Eletricista</td>
                                    <td>Ativo</td>
                                    <td><button type="button" class="btn btn-danger btnDeleteTechnician">Excluir</button></td>
                                </tr>
                                <tr>
                                    <td>Maria Souza</td>
                                    <td>Mecânica</td>
                                    <td>Inativo</td>
                                    <td><button type="button" class="btn btn-danger btnDeleteTechnician">Excluir</button></td>
                                </tr>
                                <tr>
                                    <td>Carlos Oliveira</td>
                                    <td>Automação</td>
                                    <td>Ativo</td>
                                    <td><button type="button" class="btn btn-danger btnDeleteTechnician">Excluir</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="row">
                        <button id="btnNewTechnician"
                        class="btn btn-primary"
                        >Novo Técnico</button>
                    </div>
                </main>

                <div class="modal fade"
                id="technicianModal"
                tabindex="-1"
                aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Novo Técnico
                                </h5>
                                <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input 
                                type="text"
                                id="technicianName"
                                class="form-control"
                                placeholder="Nome do Técnico"
                                >
                                <button type="button"
                                id="btnSaveTechnician"
                                class="btn btn-success"
                                >Salvar</button>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer>
            <p>2026 Sistema de Controle e Manutenção de Equipamentos ADS2026-2</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
        <script src="../js/technicians.js"></script>
    </body>
</html>
